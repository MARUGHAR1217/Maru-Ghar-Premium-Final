name: Deploy Maru Ghar Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin.html'
      - 'firebase-config.js'
      - 'maru-ghar-backend.js'
      - 'manifest.webmanifest'
      - 'maru-ghar-logo.svg'
      - 'assets/**'
      - 'icon.png'
      - 'splash.png'
      - 'maru-ghar-approved-app-icon.png'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: maru-ghar-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          set -eu

          mkdir -p _site/assets

          cp index.html _site/
          cp admin.html _site/
          cp firebase-config.js _site/
          cp manifest.webmanifest _site/

          if [ -d assets ]; then
            cp -R assets/. _site/assets/
          fi

          cp maru-ghar-backend.js _site/assets/

          if [ -f maru-ghar-logo.svg ]; then
            cp maru-ghar-logo.svg _site/
            cp maru-ghar-logo.svg _site/assets/
          else
            echo "ERROR: maru-ghar-logo.svg was not found."
            exit 1
          fi

          if [ -f icon.png ]; then
            cp icon.png _site/
          fi

          if [ -f splash.png ]; then
            cp splash.png _site/
          fi

          if [ -f maru-ghar-approved-app-icon.png ]; then
            cp maru-ghar-approved-app-icon.png _site/
          fi

          test -s _site/index.html
          test -s _site/admin.html
          test -s _site/firebase-config.js
          test -s _site/manifest.webmanifest
          test -s _site/assets/maru-ghar-backend.js
          test -s _site/assets/maru-ghar-logo.svg

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
