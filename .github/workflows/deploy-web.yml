name: Deploy Maru Ghar Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin.html'
      - 'firebase-config.js'
      - 'maru-ghar-backend.js'
      - 'manifest.webmanifest'
      - 'maru-ghar-logo.svg'
      - 'icon.png'
      - 'splash.png'
      - 'maru-ghar-approved-app-icon.png'
      - 'assets/**'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: maru-ghar-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          set -eu

          mkdir -p _site/assets

          cp index.html _site/
          cp admin.html _site/
          cp firebase-config.js _site/
          cp manifest.webmanifest _site/

          cp maru-ghar-backend.js _site/assets/

          # Keep the selected logo available at both expected paths.
          if [ -f maru-ghar-logo.svg ]; then
            cp maru-ghar-logo.svg _site/maru-ghar-logo.svg
            cp maru-ghar-logo.svg _site/assets/maru-ghar-logo.svg
          else
            echo "ERROR: maru-ghar-logo.svg is missing from repository root."
            exit 1
          fi

          if [ -f icon.png ]; then
            cp icon.png _site/
          fi

          if [ -f splash.png ]; then
            cp splash.png _site/
          fi

          if [ -f maru-ghar-approved-app-icon.png ]; then
            cp maru-
